<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270" role="img" aria-labelledby="title desc">
<title id="title">The complete benchmark card — benchmark card</title>
<desc id="desc">A reusable author-facing layout. This is a design preview, not an evaluated task. Missing component: State exactly what is absent and which downstream decision depends on it. Public evidence: List the observations and documents a solver is allowed to use. Actions and budget: Declare action costs, resource limits and irreversible effects. Strict acceptance: State the complete success contract and allow valid alternative solutions. Evidence and claims: Link the recorded runs or checked theorems. Keep distinct evidence classes visible. Known boundaries: Name the model assumptions, isolation limits and conclusions not established.</desc>
