<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270" role="img" aria-labelledby="title desc">
<title id="title">Signal Repair — benchmark card</title>
<desc id="desc">Globally bounded sensor corruption. Evidence before irreversible action. Missing component: Fill the selected action and observed exclusion witnesses. One fixed world and one global fault cap govern the episode. Public evidence: Published worlds, truthful sensor table, action success sets, costs and a trusted observation history. Actions and budget: Each query is available once. Sensing and commitment share the certified operational budget; setup has a separate tool cost. Strict acceptance: The action must work in every feasible world. Exclude each unsafe world with at least k+1 distinct observed contradictions. Recorded evidence: Scripted controls, independent finite audits, a shared-host assistant pilot and generic Lean guarantees have separate scopes. Known boundaries: Finite symbolic models; no proof of Python refinement, physical sensor validity or frontier hardness.</desc>
