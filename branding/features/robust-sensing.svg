<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">Signal Repair — evidence before irreversible action</title>
<desc id="desc">A feature within the diagnosis and decision domain. One shared corruption cap across sensor queries; evidence before irreversible action; finite worst-case cost and a robust decision certificate. No model score is asserted.</desc>
<rect x="0" y="0" width="800" height="620" rx="0" fill="#F6F4ED"/>
<rect x="14" y="14" width="772" height="592" rx="22" fill="#FFFFFF" stroke="#D7DFE8" stroke-width="1"/>
<rect x="48" y="44" width="76" height="76" rx="16" fill="#EAF0FF"/>
<circle cx="65" cy="66" r="4" fill="#2455D9"/>
<line x1="79" y1="66" x2="106" y2="66" stroke="#2455D9" stroke-width="3" stroke-linecap="round"/>
<circle cx="65" cy="84" r="4" fill="#825000"/>
<line x1="79" y1="84" x2="106" y2="84" stroke="#825000" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/>
<circle cx="65" cy="102" r="4" fill="#2455D9"/>
<line x1="79" y1="102" x2="106" y2="102" stroke="#2455D9" stroke-width="3" stroke-linecap="round"/>
<text x="744" y="88" fill="#52647B" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="400" text-anchor="end">DECISION DOMAIN / FEATURE</text>
<text x="48" y="178" fill="#172B43" font-family="DejaVu Sans, Arial, sans-serif" font-size="41" font-weight="700" text-anchor="start">Signal Repair</text>
<text x="48" y="220" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Evidence before irreversible action</text>
<text x="48" y="286" fill="#2455D9" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">SHARED CORRUPTION CAP</text>
<text x="48" y="321" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">One global budget for unreliable sensor replies.</text>
<text x="48" y="382" fill="#2455D9" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">ROBUST DECISION</text>
<text x="48" y="417" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Act only when the evidence justifies the choice.</text>
<text x="48" y="478" fill="#2455D9" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">FINITE COST CERTIFICATE</text>
<text x="48" y="513" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Check the worst-case cost within the stated model.</text>
<line x1="48" y1="557" x2="744" y2="557" stroke="#D7DFE8" stroke-width="1" stroke-linecap="round"/>
<text x="48" y="585" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A feature of the diagnosis and decision domain.</text>
</svg>
