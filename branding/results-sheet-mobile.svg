<title id="title">Evidence at a glance</title>
<desc id="desc">Measured. Unit + integration tests: 316. Release suite with no failures, errors or skips; implementation checks. Measured. Scripted control episodes: 4,050. Task-aware scripted policies across released configurations; not model scores. Measured. Independent optimum checks: 3,584. Finite model/objective comparisons against an independently represented oracle. Measured. Executed runtime cases: 2,652. Fixed-world/fault cases in 27 recorded profiles; coverage, not independent tasks. Formally checked. Generic Lean theorem roots: 14. Generic fault accounting and safe-action roots. Python refinement is not proved. Measured. Exploratory assistant pilot: 6 / 6. Shared host; six development episodes. No OS-enforced isolation or frontier score.</desc>
