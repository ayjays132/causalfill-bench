<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
<title id="title">CausalFill evidence legend</title>
<desc id="desc">Three explicit evidence classes: Measured, Formally checked and Proposed. Color is supplemented by words and symbols.</desc>
<rect x="0" y="0" width="760" height="850" rx="0" fill="#F6F4ED"/>
<text x="44" y="63" fill="#172B43" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0.5">READ THE CLAIM. THEN READ ITS SCOPE.</text>
<rect x="32" y="101" width="696" height="215" rx="18" fill="#FFFFFF" stroke="#D7DFE8" stroke-width="1"/>
<rect x="32" y="101" width="7" height="215" rx="3" fill="#2455D9"/>
<g transform="translate(58 127) scale(1.2333333333333334)">
<line x1="3" y1="26" x2="27" y2="26" stroke="#2455D9" stroke-width="2" stroke-linecap="round"/>
<rect x="4" y="16" width="4" height="7" rx="1" fill="#2455D9"/>
<rect x="13" y="10" width="4" height="13" rx="1" fill="#2455D9"/>
<rect x="22" y="3" width="4" height="20" rx="1" fill="#2455D9"/>
</g>
<text x="114" y="155" fill="#2455D9" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Measured</text>
<text x="61" y="205" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Observed in a recorded run. Read the units,</text>
<text x="61" y="240" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">configuration and source.</text>
<rect x="32" y="338" width="696" height="215" rx="18" fill="#FFFFFF" stroke="#D7DFE8" stroke-width="1"/>
<rect x="32" y="338" width="7" height="215" rx="3" fill="#126B52"/>
<g transform="translate(58 364) scale(1.2333333333333334)">
<rect x="3" y="3" width="24" height="24" rx="5" fill="none" stroke="#126B52" stroke-width="2"/>
<path d="M8 15 L13 20 L22 10" fill="none" stroke="#126B52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="114" y="392" fill="#126B52" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Formally checked</text>
<text x="61" y="442" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">A specified theorem was checked. Its assumptions</text>
<text x="61" y="477" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">and scope still matter.</text>
<rect x="32" y="575" width="696" height="215" rx="18" fill="#FFFFFF" stroke="#D7DFE8" stroke-width="1"/>
<rect x="32" y="575" width="7" height="215" rx="3" fill="#825000"/>
<g transform="translate(58 601) scale(1.2333333333333334)">
<path d="M15 2 L28 15 L15 28 L2 15 Z" fill="none" stroke="#825000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="15" cy="15" r="3" fill="#825000"/>
</g>
<text x="114" y="629" fill="#825000" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Proposed</text>
<text x="61" y="679" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">A research goal or planned experiment. No</text>
<text x="61" y="714" fill="#52647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">completed result is implied.</text>
</svg>
