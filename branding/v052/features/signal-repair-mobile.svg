<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1210" viewBox="0 0 600 1210" role="img" aria-labelledby="title desc">
<title id="title">Signal Repair: the evidence-to-action contract</title>
<desc id="desc">A fixed world, costly once-only probes and one global corruption cap. Track feasible worlds, commit an action and supply observed exclusion witnesses.</desc>
<rect x="0" y="0" width="600" height="1210" rx="0" fill="#F6F4ED"/>
<text x="40" y="54" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4B6177" letter-spacing="1.8">FEATURE 01 / SIGNAL REPAIR</text>
<text x="37" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="47" font-weight="700" text-anchor="start" fill="#172B43">Spend evidence</text>
<text x="37" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="47" font-weight="700" text-anchor="start" fill="#172B43">wisely.</text>
<text x="40" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#4B6177">A fixed world. Fallible probes.</text>
<text x="40" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#4B6177">One shared corruption cap.</text>
<rect x="40" y="302" width="520" height="113" rx="16" fill="#E9EEFC"/>
<text x="61" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#2455D9">PROBE COST + ACTION COST</text>
<text x="61" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#172B43">Stay within the operational budget.</text>
<rect x="40" y="444" width="520" height="134" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(59 468) scale(0.484375)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<rect x="16" y="23" width="96" height="78" rx="8" fill="#F6F4ED" stroke="#172B43" stroke-width="3.8"/>
<path d="M26 87 L50 56 L68 79 L86 60 L103 86" fill="none" stroke="#CCD5DE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="25" y="32" width="8" height="8" rx="1" fill="#825000"/>
<rect x="95" y="32" width="8" height="8" rx="1" fill="#825000"/>
<rect x="25" y="84" width="8" height="8" rx="1" fill="#825000"/>
<circle cx="79" cy="55" r="11" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8"/>
<path d="M63 44 V36 H71 M95 44 V36 H87 M63 66 V74 H71 M95 66 V74 H87" fill="none" stroke="#2455D9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M37 110 H95 M47 106 V114 M61 106 V114 M75 106 V114 M89 106 V114" fill="none" stroke="#4B6177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="142" y="481" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172B43">Choose probes</text>
<text x="143" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">Read each sensor at most once. Every</text>
<text x="143" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">accepted probe spends resources.</text>
<rect x="40" y="595" width="520" height="134" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(59 619) scale(0.484375)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<circle cx="36" cy="34" r="12" fill="#F6F4ED" stroke="#CCD5DE" stroke-width="3.8"/>
<circle cx="91" cy="34" r="12" fill="#F6F4ED" stroke="#CCD5DE" stroke-width="3.8"/>
<circle cx="36" cy="93" r="12" fill="#F6F4ED" stroke="#CCD5DE" stroke-width="3.8"/>
<circle cx="91" cy="93" r="12" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8"/>
<path d="M29 27 L43 41 M84 27 L98 41 M29 86 L43 100" fill="none" stroke="#4B6177" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="63" cy="63" r="14" fill="#FFFEFA" stroke="#172B43" stroke-width="3.8"/>
<path d="M73 73 L81 81 M56 63 H70 M63 56 V70" fill="none" stroke="#2455D9" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M47 34 L53 48 M80 43 L74 51 M47 84 L53 77" fill="none" stroke="#CCD5DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="142" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172B43">Track possibilities</text>
<text x="143" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">A world remains feasible while its</text>
<text x="143" y="694" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">total contradictions stay at or below</text>
<text x="143" y="722" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">k.</text>
<rect x="40" y="746" width="520" height="134" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(59 770) scale(0.484375)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<path d="M64 18 L81 35 L64 52 L47 35 Z" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M64 53 V66 H31 V83 M64 66 H97 V83" fill="none" stroke="#172B43" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="17" y="84" width="30" height="26" rx="4" fill="#F6F4ED" stroke="#172B43" stroke-width="3.8"/>
<rect x="81" y="84" width="30" height="26" rx="4" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8"/>
<path d="M17 93 H47 M81 93 H111" fill="none" stroke="#172B43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M32 84 L32 102" stroke="#172B43" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M96 84 L96 102" stroke="#2455D9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="102" cy="32" r="9" fill="#F5EBDD" stroke="#825000" stroke-width="3.8"/>
<path d="M99 32 L105 32" stroke="#825000" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</g>
<text x="142" y="783" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172B43">Commit an action</text>
<text x="143" y="817" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">Reserve the action cost. Commit</text>
<text x="143" y="845" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">once; no probes are accepted</text>
<text x="143" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">afterward.</text>
<rect x="40" y="897" width="520" height="134" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(59 921) scale(0.484375)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<path d="M31 17 H78 L97 37 V107 H31 Z" fill="#F6F4ED" stroke="#172B43" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 17 V38 H97" fill="none" stroke="#172B43" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M44 52 L66 52" stroke="#4B6177" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M44 62 L84 62" stroke="#4B6177" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M42 73 L84 73" stroke="#172B43" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M51 84 L76 84" stroke="#2455D9" stroke-width="3.8" fill="none" stroke-linecap="round"/>
<circle cx="94" cy="97" r="18" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8"/>
<path d="M85 97 L92 103 L103 90" fill="none" stroke="#2455D9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="142" y="934" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172B43">Support the fill</text>
<text x="143" y="968" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">Bind to the public contract. Cite</text>
<text x="143" y="996" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">accepted pre-commit exclusion</text>
<text x="143" y="1024" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#4B6177">witnesses.</text>
<text x="40" y="1090" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Certificate rule: cite k+1 distinct contradictory</text>
<text x="40" y="1120" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">observations for every world outside the action’s</text>
<text x="40" y="1150" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">success set.</text>
<text x="40" y="1190" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#4B6177">Finite symbolic controller · synthetic resource costs</text>
</svg>
