<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="858" viewBox="0 0 1440 858" role="img" aria-labelledby="title desc">
<title id="title">Outcome and acceptance are separate</title>
<desc id="desc">Signal Repair preserves actual action outcome independently of certificate validity. A successful committed action with an invalid certificate retains a successful operational outcome and fails strict acceptance. Illustration, not measured model results.</desc>
<rect x="0" y="0" width="1440" height="858" rx="0" fill="#F6F4ED"/>
<text x="64" y="63" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4B6177" letter-spacing="1.8">FEATURE 02 / SCORING CLARITY</text>
<text x="60" y="141" font-family="DejaVu Sans,Arial,sans-serif" font-size="53" font-weight="700" text-anchor="start" fill="#172B43">Outcome and acceptance are separate.</text>
<text x="64" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#4B6177">Signal Repair preserves what the committed action did, even when the final certificate is invalid.</text>
<rect x="64" y="238" width="640" height="154" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<text x="90" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#2455D9">OUTCOME</text>
<text x="90" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#172B43">Did the committed action succeed in the</text>
<text x="90" y="359" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#172B43">actual world?</text>
<rect x="736" y="238" width="640" height="154" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<text x="762" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#2455D9">STRICT ACCEPTANCE</text>
<text x="762" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#172B43">Did success, budget, justification and</text>
<text x="762" y="359" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#172B43">certificate obligations all pass?</text>
<rect x="64" y="434" width="1312" height="52" rx="9" fill="#102037"/>
<text x="88" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#F6F4ED">ILLUSTRATIVE CASE</text>
<text x="1058" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#F6F4ED">OUTCOME</text>
<text x="1260" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#F6F4ED">STRICT</text>
<rect x="64" y="486" width="1312" height="83" rx="0" fill="#E9EEFC"/>
<path d="M64 569 L1376 569" stroke="#CCD5DE" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<text x="88" y="536" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" fill="#172B43">Successful, justified action; within budget; valid complete certificate</text>
<text x="1058" y="536" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#2455D9">Successful</text>
<text x="1260" y="536" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#2455D9">Accepted</text>
<rect x="64" y="569" width="1312" height="83" rx="0" fill="#FFFEFA"/>
<path d="M64 652 L1376 652" stroke="#CCD5DE" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<text x="88" y="619" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" fill="#172B43">Successful action; invalid or incomplete final certificate</text>
<text x="1058" y="619" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#2455D9">Successful</text>
<text x="1260" y="619" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#825000">Rejected</text>
<rect x="64" y="652" width="1312" height="83" rx="0" fill="#FFFEFA"/>
<path d="M64 735 L1376 735" stroke="#CCD5DE" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<text x="88" y="702" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" fill="#172B43">Action fails in the actual world</text>
<text x="1058" y="702" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B43">Failed</text>
<text x="1260" y="702" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#825000">Rejected</text>
<text x="64" y="788" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172B43">No committed action is identified separately; abstention does not erase a preceding commitment.</text>
<text x="64" y="828" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#4B6177">Illustration of Signal Repair scoring semantics · no measured model result asserted</text>
</svg>
