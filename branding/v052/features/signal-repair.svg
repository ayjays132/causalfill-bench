<path d="M29 27 L43 41 M84 27 L98 41 M29 86 L43 100" fill="none" stroke="#4B6177" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="63" cy="63" r="14" fill="#FFFEFA" stroke="#172B43" stroke-width="3.8"/>
