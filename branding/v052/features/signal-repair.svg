</g>
<text x="197" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172B43">Commit an action</text>
<text x="198" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">Reserve the action cost. Commit once; no</text>
<text x="198" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">probes are accepted afterward.</text>
<text x="680" y="586" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600" text-anchor="end" fill="#4B6177">03</text>
<rect x="736" y="556" width="640" height="156" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(760 586) scale(0.65625)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<path d="M31 17 H78 L97 37 V107 H31 Z" fill="#F6F4ED" stroke="#172B43" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 17 V38 H97" fill="none" stroke="#172B43" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M44 52 L66 52" stroke="#4B6177" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M44 62 L84 62" stroke="#4B6177" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M42 73 L84 73" stroke="#172B43" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M51 84 L76 84" stroke="#2455D9" stroke-width="3.8" fill="none" stroke-linecap="round"/>
<circle cx="94" cy="97" r="18" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8"/>
<path d="M85 97 L92 103 L103 90" fill="none" stroke="#2455D9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="869" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172B43">Support the fill</text>
<text x="870" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">Bind to the public contract. Cite accepted</text>
<text x="870" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">pre-commit exclusion witnesses.</text>
<text x="1352" y="586" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600" text-anchor="end" fill="#4B6177">04</text>
<text x="64" y="776" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172B43">Certificate rule: k+1 distinct accepted pre-commit observations must contradict every world outside the action’s</text>
<text x="64" y="809" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172B43">success set.</text>
<text x="64" y="848" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#4B6177">Finite symbolic controller · synthetic resource costs · capability illustration</text>
</svg>
