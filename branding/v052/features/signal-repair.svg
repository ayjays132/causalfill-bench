<path d="M47 34 L53 48 M80 43 L74 51 M47 84 L53 77" fill="none" stroke="#CCD5DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="869" y="423" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172B43">Track possibilities</text>
<text x="870" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">A world remains feasible while its total</text>
<text x="870" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">contradictions stay at or below k.</text>
<text x="1352" y="404" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600" text-anchor="end" fill="#4B6177">02</text>
<rect x="64" y="556" width="640" height="156" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(88 586) scale(0.65625)">
