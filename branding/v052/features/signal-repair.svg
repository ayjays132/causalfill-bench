<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">Signal Repair: spend evidence wisely</title>
<desc id="desc">A fixed world, costly once-only probes and one global corruption cap. Query, track compatible worlds, commit once and bind a certificate to accepted pre-commit observations. This is a capability illustration, not an evaluation result.</desc>
<rect x="0" y="0" width="1440" height="880" rx="0" fill="#F6F4ED"/>
<text x="64" y="63" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4B6177" letter-spacing="1.8">FEATURE 01 / SIGNAL REPAIR</text>
<text x="60" y="143" font-family="DejaVu Sans,Arial,sans-serif" font-size="57" font-weight="700" text-anchor="start" fill="#172B43">Spend evidence wisely.</text>
<text x="64" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#4B6177">A fixed world. Fallible probes. One shared corruption cap.</text>
<rect x="64" y="235" width="1312" height="99" rx="18" fill="#E9EEFC"/>
<text x="90" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#2455D9">Operational budget</text>
<text x="91" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#4B6177">Accepted probes plus one terminal action</text>
<text x="1336" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="end" fill="#172B43">probe cost + action cost ≤ budget</text>
<rect x="64" y="374" width="640" height="156" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(88 404) scale(0.65625)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<rect x="16" y="23" width="96" height="78" rx="8" fill="#F6F4ED" stroke="#172B43" stroke-width="3.8"/>
<path d="M26 87 L50 56 L68 79 L86 60 L103 86" fill="none" stroke="#CCD5DE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="25" y="32" width="8" height="8" rx="1" fill="#825000"/>
<rect x="95" y="32" width="8" height="8" rx="1" fill="#825000"/>
<rect x="25" y="84" width="8" height="8" rx="1" fill="#825000"/>
<circle cx="79" cy="55" r="11" fill="#E9EEFC" stroke="#2455D9" stroke-width="3.8"/>
<path d="M63 44 V36 H71 M95 44 V36 H87 M63 66 V74 H71 M95 66 V74 H87" fill="none" stroke="#2455D9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M37 110 H95 M47 106 V114 M61 106 V114 M75 106 V114 M89 106 V114" fill="none" stroke="#4B6177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="197" y="423" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172B43">Choose probes</text>
<text x="198" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">Read each sensor at most once. Every</text>
<text x="198" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">accepted probe spends resources.</text>
<text x="680" y="404" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600" text-anchor="end" fill="#4B6177">01</text>
<rect x="736" y="374" width="640" height="156" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<g transform="translate(760 404) scale(0.65625)">
<rect x="0" y="0" width="128" height="128" rx="25" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<circle cx="36" cy="34" r="12" fill="#F6F4ED" stroke="#CCD5DE" stroke-width="3.8"/>
<circle cx="91" cy="34" r="12" fill="#F6F4ED" stroke="#CCD5DE" stroke-width="3.8"/>
