<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1250" viewBox="0 0 600 1250" role="img" aria-labelledby="title desc">
<title id="title">Outcome and acceptance are separate</title>
<desc id="desc">Signal Repair reports the actual committed action outcome independently of final certificate validity. Strict acceptance requires the successful outcome and every evidence and budget obligation.</desc>
<rect x="0" y="0" width="600" height="1250" rx="0" fill="#F6F4ED"/>
<text x="40" y="54" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4B6177" letter-spacing="1.8">FEATURE 02 / SCORING CLARITY</text>
<text x="37" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#172B43">Outcome and</text>
<text x="37" y="172" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#172B43">acceptance are</text>
<text x="37" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#172B43">separate.</text>
<text x="40" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#4B6177">Preserve what the committed action did,</text>
<text x="40" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#4B6177">even if the final certificate is invalid.</text>
<rect x="40" y="423" width="520" height="134" rx="16" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<text x="62" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#2455D9">OUTCOME</text>
<text x="62" y="495" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172B43">Did the committed action succeed in the</text>
<text x="62" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172B43">actual world?</text>
<rect x="40" y="577" width="520" height="134" rx="16" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<text x="62" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#2455D9">STRICT ACCEPTANCE</text>
<text x="62" y="649" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172B43">Did success, budget, justification and</text>
<text x="62" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172B43">certificate obligations all pass?</text>
<rect x="40" y="755" width="520" height="108" rx="15" fill="#E9EEFC" stroke="#CCD5DE" stroke-width="1.2"/>
<text x="60" y="784" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#172B43">Successful, justified action; within budget;</text>
<text x="60" y="810" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#172B43">valid complete certificate</text>
<text x="60" y="842" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#2455D9">Outcome: Successful</text>
<text x="540" y="842" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end" fill="#2455D9">Strict: Accepted</text>
<rect x="40" y="878" width="520" height="108" rx="15" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.2"/>
<text x="60" y="907" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#172B43">Successful action; invalid or incomplete</text>
<text x="60" y="933" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#172B43">final certificate</text>
<text x="60" y="965" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#2455D9">Outcome: Successful</text>
<text x="540" y="965" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end" fill="#825000">Strict: Rejected</text>
<rect x="40" y="1001" width="520" height="108" rx="15" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.2"/>
<text x="60" y="1030" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#172B43">Action fails in the actual world</text>
<text x="60" y="1088" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#2455D9">Outcome: Failed</text>
<text x="540" y="1088" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end" fill="#825000">Strict: Rejected</text>
<text x="40" y="1170" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#4B6177">No committed action is identified separately.</text>
<text x="40" y="1197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#4B6177">Scoring illustration; no model results asserted.</text>
</svg>
