<text x="83" y="451" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Run configuration</text>
<circle cx="66" cy="480" r="3" fill="#2455D9"/>
<text x="83" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Traces and record hashes</text>
<circle cx="66" cy="515" r="3" fill="#2455D9"/>
<text x="83" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Population and uncertainty</text>
<rect x="40" y="582" width="520" height="266" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<rect x="40" y="582" width="520" height="84" rx="18" fill="#E5F1EA"/>
<rect x="40" y="644" width="520" height="22" rx="0" fill="#E5F1EA"/>
