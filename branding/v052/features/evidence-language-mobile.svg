<text x="122" y="937" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172B43">A research question</text>
<circle cx="66" cy="990" r="3" fill="#825000"/>
<text x="83" y="996" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Independent model evaluation</text>
<circle cx="66" cy="1025" r="3" fill="#825000"/>
<text x="83" y="1031" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">New authored mechanisms</text>
<circle cx="66" cy="1060" r="3" fill="#825000"/>
<text x="83" y="1066" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Replication and critique</text>
<circle cx="66" cy="1095" r="3" fill="#825000"/>
<text x="83" y="1101" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Transfer studied separately</text>
<text x="40" y="1195" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">Retained formal records keep their original</text>
<text x="40" y="1227" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">version. A current code release does not</text>
<text x="40" y="1259" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4B6177">certify new proof runs.</text>
</svg>
