<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1330" viewBox="0 0 600 1330" role="img" aria-labelledby="title desc">
<title id="title">Keep every claim attached to evidence</title>
<desc id="desc">Measured observations, formally checked statements and proposed research each have distinct labels and provenance. Retained formal records preserve their original version.</desc>
<rect x="0" y="0" width="600" height="1330" rx="0" fill="#F6F4ED"/>
<text x="40" y="54" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4B6177" letter-spacing="1.8">FEATURE 03 / EVIDENCE LANGUAGE</text>
<text x="37" y="119" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#172B43">Keep every claim</text>
<text x="37" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#172B43">attached to</text>
<text x="37" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#172B43">evidence.</text>
<rect x="40" y="292" width="520" height="266" rx="18" fill="#FFFEFA" stroke="#CCD5DE" stroke-width="1.3"/>
<rect x="40" y="292" width="520" height="84" rx="18" fill="#E9EEFC"/>
