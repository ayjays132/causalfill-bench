<text x="122" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#2455D9">Measured</text>
<text x="122" y="357" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172B43">A recorded observation</text>
<circle cx="66" cy="410" r="3" fill="#2455D9"/>
<text x="83" y="416" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B43">Source fingerprint</text>
