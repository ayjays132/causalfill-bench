<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="836" viewBox="0 0 1440 836" role="img" aria-labelledby="title desc">
<title id="title">Keep every claim attached to evidence</title>
<desc id="desc">Measured observations, formally checked statements and proposed research have different requirements. Each claim keeps a specific source, scope and original evidence version. This guide is not a new proof or model evaluation.</desc>
<rect x="0" y="0" width="1440" height="836" rx="0" fill="#F6F4ED"/>
<text x="64" y="63" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4B6177" letter-spacing="1.8">FEATURE 03 / EVIDENCE LANGUAGE</text>
<text x="60" y="141" font-family="DejaVu Sans,Arial,sans-serif" font-size="53" font-weight="700" text-anchor="start" fill="#172B43">Keep every claim attached to evidence.</text>
<text x="64" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#4B6177">Clear labels keep implementation, experiments and research goals readable.</text>
