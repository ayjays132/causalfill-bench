<text x="42" y="348" font-family="DejaVu Sans,Arial,sans-serif" font-size="46" font-weight="700" text-anchor="start" fill="#172B43">Show why it works.</text>
<text x="44" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#4B6177">Budgeted evidence. Consequential actions.</text>
<text x="44" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#4B6177">Typed completions with explicit verification.</text>
