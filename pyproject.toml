[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalfill-bench"
version = "0.5.1"
description = "A research prototype for recovering missing causal components through budgeted tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Phillip A. Holland Jr."}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.scripts]
causalfill = "causalfill.cli:main"

[tool.setuptools.packages.find]
include = ["causalfill*"]

